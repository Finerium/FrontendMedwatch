<!DOCTYPE html>

<html class="dark" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

              "surface-container-high": "#2a2a2a",
              "error-container": "#93000a",
              "tertiary-fixed": "#ffdad6",
              "on-secondary": "#303030",
              "on-surface-variant": "#c0c7d2",
              "inverse-on-surface": "#303030",
              "on-primary-fixed-variant": "#004a77",
              "on-primary": "#003354",
              "surface": "#131313",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #131313;
            color: #e4e2e1;
            font-family: 'Inter', sans-serif;
        }
        .custom-shadow {
            box-shadow: 0 10px 40px rgba(0,0,0, 0.4);
        }
    </style>
</head>
<body class="antialiased overflow-hidden">
<!-- SideNavBar Component -->
<aside class="h-screen w-[200px] fixed left-0 top-0 bg-[#1a1a1a] flex flex-col py-6 z-50">
<div class="px-6 mb-8">
<h1 class="text-xl font-bold tracking-tighter text-[#98cbff]">MedWatch</h1>
</div>
<nav class="flex-1 flex flex-col gap-1">
<a class="text-[#a0a0a0] px-6 py-3 flex items-center gap-3 text-sm" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span>Dashboard</span>
</a>
<a class="text-[#a0a0a0] px-6 py-3 flex items-center gap-3 text-sm" href="#">
<span class="material-symbols-outlined">search</span>
<span>Cari Obat</span>
</a>
<a class="text-[#a0a0a0] px-6 py-3 flex items-center gap-3 text-sm" href="#">
<span class="material-symbols-outlined">compare_arrows</span>
<span>Bandingkan Obat</span>
</a>
<a class="bg-[#353535] text-[#98cbff] border-l-[3px] border-[#3b8ed0] px-6 py-3 flex items-center gap-3 text-sm" href="#">
<span class="material-symbols-outlined">group</span>
<span>Data Pasien</span>
</a>
<a class="text-[#a0a0a0] px-6 py-3 flex items-center gap-3 text-sm" href="#">
<span class="material-symbols-outlined">monitoring</span>
<span>Visualisasi</span>
</a>
<a class="text-[#a0a0a0] px-6 py-3 flex items-center gap-3 text-sm" href="#">
<span class="material-symbols-outlined">security</span>
<span>Safety Checker</span>
</a>
<a class="text-[#a0a0a0] px-6 py-3 flex items-center gap-3 text-sm" href="#">
<span class="material-symbols-outlined">picture_as_pdf</span>
<span>Export PDF</span>
</a>
</nav>
</aside>
<!-- Main Content Area -->
<main class="ml-[200px] min-h-screen bg-background relative flex flex-col">
<!-- TopAppBar Component -->
<header class="h-16 flex items-center px-8">
<h2 class="text-lg font-semibold text-[#e4e2e1]">Tambah Pasien Baru</h2>
</header>
<!-- Form Content -->
<div class="flex-1 p-10 flex justify-center items-start overflow-y-auto">
<div class="w-full max-w-2xl bg-surface-container custom-shadow rounded-xl overflow-hidden border border-white/5">
<!-- Header of the 'Modal-like' Form -->
<div class="px-8 py-6 border-b border-surface-variant/30 flex items-center justify-between">
<div>
<h3 class="text-xl font-bold text-on-surface">Form Registrasi</h3>
<p class="text-xs text-on-surface-variant mt-1">Lengkapi data medis pasien untuk penyimpanan database.</p>
</div>
<div class="bg-primary-container/10 p-3 rounded-full">
<span class="material-symbols-outlined text-primary">person_add</span>
</div>
</div>
<!-- Vertical Form Fields -->
<div class="p-8 space-y-6">
<!-- Nama Lengkap -->
<div class="space-y-2">
<label class="text-sm font-medium text-on-surface-variant block">Nama Lengkap</label>
<input class="w-full bg-surface-container-lowest border-none rounded-lg px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary focus:bg-surface-container-high transition-all outline-none" placeholder="Masukkan nama lengkap pasien" type="text"/>
</div>
<!-- Usia & Tanggal Kunjungan Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="text-sm font-medium text-on-surface-variant block">Usia</label>
<input class="w-full bg-surface-container-lowest border-none rounded-lg px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary focus:bg-surface-container-high transition-all outline-none" placeholder="Contoh: 25" type="number"/>
</div>
<div class="space-y-2">
<label class="text-sm font-medium text-on-surface-variant block">Tanggal Kunjungan</label>
<input class="w-full bg-surface-container-lowest border-none rounded-lg px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary focus:bg-surface-container-high transition-all outline-none" placeholder="DD/MM/YYYY" type="text"/>
</div>
</div>
<!-- Keluhan -->
<div class="space-y-2">
<label class="text-sm font-medium text-on-surface-variant block">Keluhan Utama</label>
<textarea class="w-full bg-surface-container-lowest border-none rounded-lg px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary focus:bg-surface-container-high transition-all outline-none resize-none" placeholder="Deskripsikan keluhan yang dirasakan pasien..." rows="3"></textarea>
</div>
<!-- Diagnosa -->
<div class="space-y-2">
<label class="text-sm font-medium text-on-surface-variant block">Diagnosa Medis</label>
<input class="w-full bg-surface-container-lowest border-none rounded-lg px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary focus:bg-surface-container-high transition-all outline-none" placeholder="Hasil pemeriksaan awal" type="text"/>
</div>
<!-- Obat yang Diberikan -->
<div class="space-y-2">
<label class="text-sm font-medium text-on-surface-variant block">Obat yang Diberikan</label>
<input class="w-full bg-surface-container-lowest border-none rounded-lg px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary focus:bg-surface-container-high transition-all outline-none" placeholder="Nama obat dan dosis" type="text"/>
</div>
</div>
<!-- Buttons Footer -->
<div class="px-8 py-6 bg-surface-container-high/50 flex items-center justify-end gap-4">
<button class="px-6 py-2.5 rounded-lg text-sm font-semibold text-on-surface hover:bg-surface-variant transition-colors bg-secondary-container">
                        Batal
                    </button>
<button class="px-8 py-2.5 rounded-lg text-sm font-semibold text-on-primary bg-gradient-to-r from-primary to-primary-container shadow-lg shadow-primary/20 hover:opacity-90 active:scale-95 transition-all">
                        Simpan Data
                    </button>
</div>
</div>
</div>
<!-- Decorative Subtle Background Graphic -->
<div class="fixed bottom-0 right-0 w-96 h-96 opacity-10 pointer-events-none -z-10 translate-x-1/4 translate-y-1/4">
<svg viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<path d="M44.7,-76.4C58.8,-69.2,71.8,-59.1,79.6,-45.8C87.4,-32.4,90.1,-16.2,88.5,-0.9C86.9,14.4,81,28.8,72.4,41.4C63.8,54,52.5,64.8,39.4,72.5C26.3,80.1,13.1,84.7,-0.7,85.9C-14.5,87.1,-29,85,-42.2,78.2C-55.3,71.4,-67.2,60,-75.4,46.5C-83.6,33.1,-88.1,16.5,-87.7,0.2C-87.3,-16.1,-82,-32.1,-72.9,-45.1C-63.8,-58.1,-50.9,-68,-36.8,-75.2C-22.7,-82.4,-11.3,-86.9,2.6,-91.4C16.5,-95.9,30.6,-83.6,44.7,-76.4Z" fill="#98cbff" transform="translate(100 100)"></path>
</svg>
</div>
</main>
</body></html>
