<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E8B7A"/></marker></defs>
<rect width="1240" height="880" fill="#FBFDFC"/>
<text x="40" y="44" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#0E4B42" text-anchor="start" font-weight="bold">MedWatch System Architecture</text>
<text x="40" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#46514C" text-anchor="start" font-weight="normal">Satu backend Flask plus satu codebase Next.js, dua mode runtime: desktop offline dan web showcase.</text>
<rect x="40" y="96" width="560" height="34" rx="8" fill="#1E6E62"/>
<text x="320" y="118" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">DESKTOP MODE (offline penuh)</text>
<rect x="640" y="96" width="560" height="34" rx="8" fill="#2E8B7A"/>
<text x="920" y="118" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">WEB MODE (showcase)</text>
<rect x="70" y="150" width="500" height="78" rx="10" fill="#E8F4F0" stroke="#3A9688" stroke-width="1.5"/>
<text x="84" y="174" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#1E6E62" text-anchor="start" font-weight="bold">Electron shell</text>
<text x="84" y="196" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">installer-based app (NSIS) + portable-app</text>
<text x="84" y="212" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">app.disableHardwareAcceleration(), no-GPU safe</text>
<line x1="320" y1="228" x2="320" y2="252" stroke="#2E8B7A" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="330" y="246" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#46514C" text-anchor="start" font-weight="normal">spawn</text>
<rect x="70" y="256" width="500" height="80" rx="10" fill="#FFFFFF" stroke="#3A9688" stroke-width="1.5"/>
<text x="84" y="280" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#1E6E62" text-anchor="start" font-weight="bold">Flask backend (frozen, PyInstaller)</text>
<text x="84" y="302" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">api/desktop_entry.py, bind 127.0.0.1:&lt;ephemeral port&gt;</text>
<text x="84" y="318" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">handshake MEDWATCH_BACKEND_PORT ke Electron</text>
<line x1="320" y1="336" x2="320" y2="360" stroke="#2E8B7A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="330" y="354" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#46514C" text-anchor="start" font-weight="normal">serve loopback</text>
<rect x="70" y="364" width="500" height="76" rx="10" fill="#FFFFFF" stroke="#3A9688" stroke-width="1.5"/>
<text x="84" y="388" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#1E6E62" text-anchor="start" font-weight="bold">Renderer: Next.js static export</text>
<text x="84" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">out/ di-stage ke resources/renderer</text>
<text x="84" y="426" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">font self-host, nol panggilan CDN</text>
<line x1="320" y1="440" x2="320" y2="464" stroke="#2E8B7A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="330" y="458" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#46514C" text-anchor="start" font-weight="normal">read</text>
<rect x="70" y="468" width="500" height="80" rx="10" fill="#FBF1E0" stroke="#D9B870" stroke-width="1.5"/>
<text x="84" y="492" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#9A6B12" text-anchor="start" font-weight="bold">Data lokal (per-user, userData)</text>
<text x="84" y="514" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">drugs.db disalin saat install / di-refresh saat upgrade</text>
<text x="84" y="530" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">users.json + patients.json (JSON store)</text>
<rect x="670" y="150" width="500" height="78" rx="10" fill="#EAF1F7" stroke="#A8C2DC" stroke-width="1.5"/>
<text x="684" y="174" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#3A6EA5" text-anchor="start" font-weight="bold">Browser</text>
<text x="684" y="196" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">memuat static export dari Vercel edge/CDN</text>
<text x="684" y="212" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">token Bearer di localStorage</text>
<line x1="920" y1="228" x2="920" y2="252" stroke="#2E8B7A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="930" y="246" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#46514C" text-anchor="start" font-weight="normal">Bearer + NEXT_PUBLIC_API_BASE</text>
<rect x="670" y="256" width="500" height="80" rx="10" fill="#FFFFFF" stroke="#3A9688" stroke-width="1.5"/>
<text x="684" y="280" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#1E6E62" text-anchor="start" font-weight="bold">Next.js di Vercel (static export)</text>
<text x="684" y="302" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">medwatch-frontend.vercel.app</text>
<text x="684" y="318" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">build bake NEXT_PUBLIC_API_BASE = URL Cloud Run</text>
<line x1="920" y1="336" x2="920" y2="360" stroke="#2E8B7A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="930" y="354" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#46514C" text-anchor="start" font-weight="normal">HTTPS cross-origin (CORS allowlist)</text>
<rect x="670" y="364" width="500" height="76" rx="10" fill="#FFFFFF" stroke="#3A9688" stroke-width="1.5"/>
<text x="684" y="388" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#1E6E62" text-anchor="start" font-weight="bold">Flask di Cloud Run (gunicorn)</text>
<text x="684" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">asia-southeast1, USE_CLOUD_STORAGE=true</text>
<text x="684" y="426" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">MEDWATCH_TRUST_PROXY, MEDWATCH_PEPPER (env)</text>
<line x1="920" y1="440" x2="920" y2="464" stroke="#2E8B7A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="930" y="458" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#46514C" text-anchor="start" font-weight="normal">read / write</text>
<rect x="670" y="468" width="500" height="80" rx="10" fill="#FBF1E0" stroke="#D9B870" stroke-width="1.5"/>
<text x="684" y="492" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#9A6B12" text-anchor="start" font-weight="bold">Data terkelola</text>
<text x="684" y="514" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">drugs.db di-bake ke image (read-only)</text>
<text x="684" y="530" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#46514C" text-anchor="start" font-weight="normal">users.json + patients.json di GCS bucket</text>
<rect x="40" y="580" width="1160" height="122" rx="12" fill="#F2F8F6" stroke="#C2DDD5" stroke-width="1.5"/>
<text x="60" y="608" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0E4B42" text-anchor="start" font-weight="bold">Inti bersama (sama persis di dua mode)</text>
<text x="60" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#46514C" text-anchor="start" font-weight="normal">Backend api/ (Flask): auth Argon2id + JWT HS256 Bearer (no cookie), drug_db.py (SQLite FTS5), routes drug / patient / safety / pdf / visualization / admin.</text>
<text x="60" y="652" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#46514C" text-anchor="start" font-weight="normal">Dual-mode src/lib/api-base.ts: ada window.__MEDWATCH_BACKEND_PORT__ -&gt; loopback 127.0.0.1 (desktop); selain itu NEXT_PUBLIC_API_BASE -&gt; Cloud Run (web); else path relatif (dev).</text>
<text x="60" y="672" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#46514C" text-anchor="start" font-weight="normal">Katalog drugs.db: 20.828 baris, FTS5, kolom display_name bersih, multi-sumber openFDA + RxNorm + DailyMed. Search-first: list default 15, /api/drugs/search LIMIT 15 ORDER BY rank.</text>
<text x="60" y="692" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#46514C" text-anchor="start" font-weight="normal">DB tidak ada = loud failure (HTTP 503), bukan diam-diam fallback ke JSON kecil. Admin tidak bisa self-register; endpoint demo-admin passwordless sudah dicabut.</text>
<rect x="40" y="718" width="1160" height="36" rx="8" fill="#E8F4F0" stroke="#C2DDD5" stroke-width="1.5"/>
<text x="60" y="741" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1E6E62" text-anchor="start" font-weight="bold">Deploy backend: gcloud run deploy --source . (root Dockerfile membake drugs.db). Installer + landing: Release v0.2.0.</text>
<text x="40" y="800" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#46514C" text-anchor="start" font-weight="normal">Sumber kebenaran: kode repo Bisura16/medWatch dan Finerium/FrontendMedwatch, terverifikasi runtime.</text>
</svg>
