<!DOCTYPE html>

<html class="dark" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MedWatch - Export PDF</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface": "#131313",
              "outline-variant": "#404750",
              "on-tertiary-container": "#5c0000",
              "error": "#ffb4ab",
              "tertiary-fixed": "#ffdad4",
              "inverse-on-surface": "#303030",
              "secondary-fixed": "#e5e2e1",
              "inverse-primary": "#00639c",
              "secondary-fixed-dim": "#c8c6c5",
              "on-primary-fixed": "#001d33",
              "primary-container": "#4596d9",
              "surface-container-highest": "#353535",
              "tertiary": "#ffb4a8",
              "primary-fixed-dim": "#98cbff",
              "inverse-surface": "#e4e2e1",
              "primary": "#98cbff",
              "on-secondary": "#303030",
              "tertiary-fixed-dim": "#ffb4a8",
              "on-tertiary": "#690000",
              "on-surface-variant": "#c0c7d2",
              "surface-container-high": "#2a2a2a",
              "error-container": "#93000a",
              "on-error": "#690005",
              "background": "#131313",
              "on-background": "#e4e2e1",
              "surface-container-low": "#1b1c1c",
              "on-secondary-container": "#b7b5b4",
              "surface-variant": "#353535",
              "surface-container": "#1f2020",
              "secondary": "#c8c6c5",
              "surface-tint": "#98cbff",
              "on-tertiary-fixed": "#410000",
              "on-primary": "#003354",
              "on-primary-container": "#002c49",
              "surface-container-lowest": "#0e0e0e",
              "on-secondary-fixed": "#1b1b1c",
              "tertiary-container": "#fb5945",
              "primary-fixed": "#cee5ff",
              "on-tertiary-fixed-variant": "#920703",
              "on-error-container": "#ffdad6",
              "on-surface": "#e4e2e1",
              "outline": "#8a919b",
              "surface-bright": "#393939",
              "on-primary-fixed-variant": "#004a77",
              "on-secondary-fixed-variant": "#474746",
              "secondary-container": "#474746",
              "surface-dim": "#131313"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-[#2b2b2b] text-on-background min-h-screen flex overflow-hidden">
<!-- SideNavBar -->
<aside class="h-screen w-[200px] fixed left-0 top-0 bg-[#1a1a1a] flex flex-col py-6 z-50">
<div class="px-6 mb-8">
<h1 class="text-xl font-bold tracking-tighter text-[#98cbff]">MedWatch</h1>
</div>
<nav class="flex-1 flex flex-col gap-1">
<a class="text-[#a0a0a0] px-6 py-3 flex items-center gap-3 text-sm" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span>Dashboard</span>
</a>
<a class="text-[#a0a0a0] px-6 py-3 flex items-center gap-3 text-sm" href="#">
<span class="material-symbols-outlined">search</span>
<span>Cari Obat</span>
</a>
<a class="text-[#a0a0a0] px-6 py-3 flex items-center gap-3 text-sm" href="#">
<span class="material-symbols-outlined">compare_arrows</span>
<span>Bandingkan Obat</span>
</a>
<a class="text-[#a0a0a0] px-6 py-3 flex items-center gap-3 text-sm" href="#">
<span class="material-symbols-outlined">group</span>
<span>Data Pasien</span>
</a>
<a class="text-[#a0a0a0] px-6 py-3 flex items-center gap-3 text-sm" href="#">
<span class="material-symbols-outlined">monitoring</span>
<span>Visualisasi</span>
</a>
<a class="text-[#a0a0a0] px-6 py-3 flex items-center gap-3 text-sm" href="#">
<span class="material-symbols-outlined">security</span>
<span>Safety Checker</span>
</a>
<a class="bg-[#353535] text-[#98cbff] border-l-[3px] border-[#3b8ed0] px-6 py-3 flex items-center gap-3 text-sm" href="#">
<span class="material-symbols-outlined">picture_as_pdf</span>
<span>Export PDF</span>
</a>
</nav>
</aside>
<!-- Main Content Area -->
<main class="ml-[200px] flex-1 flex flex-col h-screen overflow-y-auto">
<!-- TopAppBar -->
<header class="h-16 flex items-center px-8">
<h2 class="text-lg font-semibold text-[#e4e2e1]">Export Laporan PDF</h2>
</header>
<!-- Form Content -->
<div class="p-8 max-w-4xl mx-auto w-full">
<div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
<!-- Form Options Section -->
<section class="space-y-6">
<div class="space-y-2">
<label class="block text-sm font-medium text-gray-300">Jenis Laporan</label>
<select class="w-full bg-surface-container-highest border-none rounded-lg text-on-surface focus:ring-2 focus:ring-[#98cbff]/40 py-2.5 px-4">
<option>Rekap Pasien Bulanan</option>
<option>Analisis Tren Obat</option>
<option>Log Keamanan Sistem</option>
</select>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block text-sm font-medium text-gray-300">Dari: [MM/YYYY]</label>
<input class="w-full bg-surface-container-highest border-none rounded-lg text-on-surface focus:ring-2 focus:ring-[#98cbff]/40 py-2.5 px-4" placeholder="01/2024" type="text"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-medium text-gray-300">Sampai: [MM/YYYY]</label>
<input class="w-full bg-surface-container-highest border-none rounded-lg text-on-surface focus:ring-2 focus:ring-[#98cbff]/40 py-2.5 px-4" placeholder="12/2024" type="text"/>
</div>
</div>
<div class="space-y-4 pt-2">
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center">
<input checked="" class="w-5 h-5 rounded border-none bg-surface-container-highest text-[#3b8ed0] focus:ring-0 focus:ring-offset-0" type="checkbox"/>
</div>
<span class="text-sm text-on-surface-variant group-hover:text-white transition-colors">Sertakan grafik visualisasi</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center">
<input class="w-5 h-5 rounded border-none bg-surface-container-highest text-[#3b8ed0] focus:ring-0 focus:ring-offset-0" type="checkbox"/>
</div>
<span class="text-sm text-on-surface-variant group-hover:text-white transition-colors">Sertakan peringatan obat</span>
</label>
</div>
<button class="w-full bg-[#3b8ed0] hover:bg-[#4596d9] text-white font-semibold py-3 px-6 rounded-lg shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4">
<span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
                        Generate PDF
                    </button>
</section>
<!-- Preview Area Section -->
<section class="space-y-6">
<label class="block text-sm font-medium text-gray-300">Preview Laporan</label>
<div class="bg-[#3a3a3a] rounded-xl aspect-[3/4] flex items-center justify-center p-8 shadow-inner overflow-hidden">
<!-- Document Thumbnail Representation -->
<div class="bg-white w-full h-full rounded shadow-2xl p-6 flex flex-col gap-3">
<div class="h-4 w-2/3 bg-gray-200 rounded-sm"></div>
<div class="h-2 w-full bg-gray-100 rounded-sm"></div>
<div class="h-2 w-full bg-gray-100 rounded-sm"></div>
<div class="h-2 w-4/5 bg-gray-100 rounded-sm"></div>
<div class="mt-4 h-24 w-full bg-gray-50 border border-dashed border-gray-200 rounded flex flex-col gap-2 p-3">
<div class="h-1 w-full bg-blue-100 rounded-full"></div>
<div class="h-1 w-5/6 bg-blue-100 rounded-full"></div>
<div class="h-1 w-4/6 bg-blue-100 rounded-full"></div>
<div class="mt-auto flex justify-between">
<div class="h-8 w-8 rounded-full border-2 border-blue-50"></div>
<div class="h-8 w-12 bg-gray-100 rounded"></div>
</div>
</div>
<div class="mt-auto space-y-2">
<div class="h-1.5 w-full bg-gray-100 rounded-sm"></div>
<div class="h-1.5 w-full bg-gray-100 rounded-sm"></div>
<div class="h-1.5 w-1/2 bg-gray-100 rounded-sm"></div>
</div>
</div>
</div>
<!-- Action Buttons below preview -->
<div class="flex gap-4">
<button class="flex-1 bg-[#3b8ed0] hover:bg-[#4596d9] text-white font-medium py-2.5 px-4 rounded-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg" data-icon="save">save</span>
                            Simpan PDF
                        </button>
<button class="px-6 bg-[#1e1e1e] hover:bg-[#353535] text-gray-400 hover:text-white font-medium py-2.5 rounded-lg active:scale-[0.98] transition-all">
                            Batal
                        </button>
</div>
</section>
</div>
</div>
</main>
</body></html>
